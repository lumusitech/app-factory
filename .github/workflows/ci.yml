name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  boundaries:
    name: fronteras del kernel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Reglas de frontera sobre el árbol real
        run: pnpm boundary:check

      - name: Self-test del gate (dispara y no sobre-dispara)
        run: pnpm boundary:selftest
