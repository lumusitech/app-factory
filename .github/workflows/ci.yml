name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  boundaries:
    name: fronteras del kernel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Reglas de frontera sobre el árbol real
        run: pnpm boundary:check

      - name: Self-test del gate (dispara y no sobre-dispara)
        run: pnpm boundary:selftest

  kernel:
    name: kernel (typecheck + tests + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Typecheck (incluye los contratos de tipo)
        run: pnpm typecheck

      - name: Tests (bloquean el merge si fallan, CONTRIBUTING §8.4)
        run: pnpm test:ci

      - name: Build del kernel
        run: pnpm build

  create-vertical:
    name: generador de verticales (fase 4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Self-test del generador (cubre bordes)
        run: pnpm create-vertical:selftest

      - name: Generar una vertical de prueba
        run: pnpm create-vertical scratch-vertical

      - name: Instalar con la vertical generada
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck de la vertical generada
        run: pnpm --filter @app/scratch-vertical typecheck

      - name: Tests de la vertical generada (deben pasar)
        run: pnpm --filter @app/scratch-vertical test

      - name: Fronteras sobre la vertical generada
        run: pnpm boundary:check
